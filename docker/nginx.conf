#全局块
#user  nobody;
worker_processes  1;

#event块
events {
    worker_connections  1024;
}

#http块
http {
    #http全局块
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    #server块
    server {
        listen       3005;
        server_name  localhost;
        root         /app/berry;

        location / {
            root   html;
            index  index.html index.htm;
        }
        location = /llm_proxy {
            rewrite /llm_proxy / break;
        }
        location /llm_proxy {
            rewrite ^/llm_proxy/(.*)$ /$1 break;
        }
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
