# 生产用：构建带 registry tag 的镜像，推仓库后由其他服务拉取部署；
# 也可直接在服务器上构建运行（scripts/build-and-deploy.sh 走的就是这条）。
# 环境变量放在 docker/ubuntu.env（已在 .gitignore 中）。
services:
  llm-proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: registry.cn-shenzhen.aliyuncs.com/zikun/llm-proxy:latest
    container_name: llm-proxy
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ../data:/data
    environment:
      - SESSION_SECRET=${SESSION_SECRET:-please_change_to_random_string}
      - TZ=${TZ:-Asia/Shanghai}
      # 首次启动创建的 root 账号（仅数据库中没有任何用户时生效）
      - INITIAL_ROOT_USERNAME=${INITIAL_ROOT_USERNAME:-}
      - INITIAL_ROOT_PASSWORD=${INITIAL_ROOT_PASSWORD:-}
      # Redis（可选，仅多节点部署时需要；REDIS_SERVER 留空则自动使用 cookie session）
      - REDIS_CONN_STRING=${REDIS_CONN_STRING:-}
      - REDIS_MODE=${REDIS_MODE:-single}
      - REDIS_SERVER=${REDIS_SERVER:-}
      # 数据库类型：必填，mysql / postgres / sqlite。
      # 不设默认值是有意的：连哪个库必须显式声明，避免漏配后悄悄起一个空的 SQLite。
      - DB_TYPE=${DB_TYPE:-sqlite}
      # MySQL 连接参数（DB_TYPE=mysql 时使用，MYSQL_HOST 必填）
      - MYSQL_HOST=${MYSQL_HOST:-}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-llm_proxy}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-}
      - MYSQL_DB=${MYSQL_DB:-llm_proxy}
      # PostgreSQL 连接参数（DB_TYPE=postgres 时使用，PG_HOST 必填）
      - PG_HOST=${PG_HOST:-}
      - PG_PORT=${PG_PORT:-5432}
      - PG_USER=${PG_USER:-llm_proxy}
      - PG_PASSWORD=${PG_PASSWORD:-}
      - PG_DB=${PG_DB:-llm_proxy}
      # 也可以直接给完整连接串，此时以它为准、按 postgres:// 前缀判断类型，DB_TYPE 不再生效
      - SQL_DSN=${SQL_DSN:-}
      # RabbitMQ 会话数据回流（可选，RABBITMQ_SERVER 留空则不上报）
      - RABBITMQ_SERVER=${RABBITMQ_SERVER:-}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-}
      - RABBITMQ_QUEUE_NAME=${RABBITMQ_QUEUE_NAME:-LLM_PROXY_QUEUE}
      # 出站代理：访问 Google 等境外 API 超时时配置（对应 config.RelayProxy）
      - RELAY_PROXY=${RELAY_PROXY:-}
      - RELAY_TIMEOUT=${RELAY_TIMEOUT:-0}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/status | grep -o '\"success\":true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"

